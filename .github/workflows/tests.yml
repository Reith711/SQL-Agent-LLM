# Automatyczne testy na GitHubie: uruchamiają się przy każdym pushu.
# Testy nie łączą się z modelem, więc nie potrzebują prawdziwego klucza API.
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -v
